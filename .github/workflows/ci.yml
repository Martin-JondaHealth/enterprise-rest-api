name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enterprise_db_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5434/enterprise_db_test?schema=public"
      REDIS_HOST: "localhost"
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: "ci-test-jwt-access-secret-minimum-32-characters"
      JWT_REFRESH_SECRET: "ci-test-jwt-refresh-secret-minimum-32-characters"
      JWT_ACCESS_EXPIRATION: "15m"
      JWT_REFRESH_EXPIRATION: "7d"
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations
        run: npx prisma migrate deploy

      - name: Run Database Seeder
        run: npx prisma db seed

      - name: Run Linters
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Run E2E Integration Tests
        run: npm run test:e2e

      - name: Build Production Bundle
        run: npm run build
